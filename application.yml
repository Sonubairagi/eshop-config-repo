#spring application config
spring:
  #kafka Config - import kafka config
  config:
    import: "optional:kafka.yml"

#Eureka/Registry/Discovery Client Config
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
